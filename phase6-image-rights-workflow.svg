<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="t d"><title id="t">Image rights clearance workflow</title><desc id="d">Three-step image review: identify the source, confirm permission, approve the intended use.</desc><rect width="900" height="230" rx="18" fill="#f8f4f7"/><g font-family="system-ui,sans-serif"><rect x="22" y="28" width="250" height="174" rx="14" fill="#342231"/><rect x="325" y="28" width="250" height="174" rx="14" fill="#704b69"/><rect x="628" y="28" width="250" height="174" rx="14" fill="#327249"/><path d="M278 114h38m-12-12 12 12-12 12M581 114h38m-12-12 12 12-12 12" stroke="#bd7d9e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g text-anchor="middle" fill="#fff5fa"><text x="147" y="66" font-size="13" font-weight="700" letter-spacing="2">STEP 01</text><text x="147" y="105" font-size="21" font-weight="800">IDENTIFY</text><text x="147" y="133" font-size="13">Source · creator · date</text><text x="147" y="155" font-size="13">Asset filename &amp; origin</text><text x="450" y="66" font-size="13" font-weight="700" letter-spacing="2">STEP 02</text><text x="450" y="105" font-size="21" font-weight="800">VERIFY RIGHTS</text><text x="450" y="133" font-size="13">License · releases · limits</text><text x="450" y="155" font-size="13">Keep written evidence</text><text x="753" y="66" font-size="13" font-weight="700" letter-spacing="2">STEP 03</text><text x="753" y="105" font-size="21" font-weight="800">APPROVE USE</text><text x="753" y="133" font-size="13">Channels · edits · expiry</text><text x="753" y="155" font-size="13">Reviewer sign-off</text></g></g></svg>
