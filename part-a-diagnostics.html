<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#100c10"><title>BLACKED · Part A Diagnostics</title><style>:root{color-scheme:dark;--bg:#0d0a0e;--panel:#181219;--line:#493344;--cream:#fff5fa;--pink:#f4a0c1;--muted:#c9bac5;--ok:#9be3b0;--bad:#ff9da6;--warn:#eacb8c}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:1000px;margin-inline:auto;background:var(--bg);color:var(--cream);font:15px/1.55 system-ui,sans-serif}h1{font-size:clamp(25px,5vw,38px);line-height:1.12}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px;margin:14px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:10px 14px;border-radius:11px;border:1px solid var(--pink);background:var(--pink);color:#170d13;font-weight:800;text-decoration:none}.btn.alt{background:transparent;color:var(--cream)}.row{border-bottom:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.PASS{color:var(--ok)}.FAIL{color:var(--bad)}.WARN{color:var(--warn)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#100c10;padding:12px;border-radius:10px;font-size:12px}.muted{color:var(--muted)}button:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:3px}iframe{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none;border:0}</style></head><body><main><p class="muted">BLACKED · PART A · STORY FOUNDATION</p><h1>Part A — upload & regression diagnostics</h1><p class="muted">Checks the uploaded files and application runtime. Image requests are tested separately because upstream GitHub access depends on the visitor’s network.</p><section class="panel"><div class="actions"><a class="btn" href="./index.html">Open website</a><button class="btn alt" id="run" type="button">Run Part A checks</button><button class="btn alt" id="images" type="button">Check image URLs</button></div><p id="status" role="status" aria-live="polite">Not run yet.</p></section><iframe id="runtime" title="Hidden same-origin app runtime" src="./index.html?partAtest=1" aria-hidden="true"></iframe><section class="panel"><h2>Results</h2><div id="results"></div></section><section class="panel"><h2>Raw report</h2><pre id="raw">No tests run.</pre></section></main><script>const $=s=>document.querySelector(s);function row(n,ok,d=''){const el=document.createElement('div');el.className='row';const b=document.createElement('b');b.className=ok?'PASS':'FAIL';b.textContent=ok?'PASS':'FAIL';const t=document.createElement('div');t.textContent=n;const p=document.createElement('div');p.className='muted';p.textContent=d;el.append(b,t,p);$('#results').append(el)}const wait=ms=>new Promise(r=>setTimeout(r,ms));async function getRuntime(){for(let i=0;i<80;i++){try{const w=$('#runtime').contentWindow;const d=w.BLACKED_V1?.getDiagnostics?.();if(d?.loaded)return d}catch{}await wait(150)}return null}$('#run').addEventListener('click',async()=>{$('#results').textContent='';$('#status').textContent='Checking local files and app features…';const names=['index.html','app.js','styles.css','fallback.js','sw.js','manifest.webmanifest','innerwear-image-library.json','phase7-diagnostics.html','part-a-diagnostics.html'];const files=await Promise.all(names.map(async n=>{try{const r=await fetch('./'+n,{cache:'no-store'});return {name:n,ok:r.ok,status:r.status}}catch(e){return{name:n,ok:false,error:String(e)}}}));files.forEach(f=>row('File '+f.name,f.ok,f.ok?'HTTP '+f.status:f.error||'HTTP '+f.status));const d=await getRuntime();if(!d){row('App boot',false,'BLACKED_V1 diagnostics not ready');$('#raw').textContent=JSON.stringify({files,runtime:null,liveSite:true},null,2);return}const checks=[['Seven main views remain',d.views?.length>=7,`${d.views?.length||0} views`],['10 original stories',d.sexStoriesCount===10,`count=${d.sexStoriesCount}`],['Language and sort filters',d.storyLanguageFilter&&d.storySort,`language=${d.storyLanguageFilter}; sort=${d.storySort}`],['Dirty Hinglish poll',d.dirtyPoll,String(d.dirtyPoll)],['Story modal',d.storyModal,String(d.storyModal)],['Next update tease',d.nextUpdateSpotlight,String(d.nextUpdateSpotlight)],['151 image records',d.imageLibraryCount===151,`ready=${d.imageLibraryReady}; count=${d.imageLibraryCount}`],['Image archive pagination',d.imageLibraryRendered>0&&d.imageLibraryRendered<=24,`first render=${d.imageLibraryRendered}`],['Original three wheels',d.originalWheels?.boy&&d.originalWheels?.dildo&&d.originalWheels?.plug,JSON.stringify(d.originalWheels)],['Dirty/Wild wheel',d.wildWheel,String(d.wildWheel)],['Wellness measurement tool',d.wellnessMeasurementTool,String(d.wellnessMeasurementTool)],['Privacy controls',d.privacyControls,String(d.privacyControls)]];checks.forEach(x=>row(x[0],!!x[1],x[2]));$('#raw').textContent=JSON.stringify({files,runtime:d,checkedAt:new Date().toISOString(),liveAndroid:'Must be tested separately on physical device'},null,2);$('#status').textContent='Part A check completed. Review failures before release.'});$('#images').addEventListener('click',async()=>{$('#results').textContent='';$('#status').textContent='Testing image URLs in batches of 12 (7-second timeout each)…';let list;try{const r=await fetch('./innerwear-image-library.json',{cache:'no-store'});if(!r.ok)throw Error('Manifest HTTP '+r.status);list=await r.json()}catch(e){row('Image manifest',false,String(e));return}let loaded=0,failed=0;const misses=[];const one=x=>new Promise(resolve=>{const i=new Image();let done=false;const finish=s=>{if(done)return;done=true;clearTimeout(t);resolve({x,s})};const t=setTimeout(()=>finish('timeout'),7000);i.onload=()=>finish('loaded');i.onerror=()=>finish('failed');i.referrerPolicy='no-referrer';i.src=x.src});for(let n=0;n<list.length;n+=12){const batch=await Promise.all(list.slice(n,n+12).map(one));for(const r of batch){if(r.s==='loaded')loaded++;else{failed++;if(misses.length<40)misses.push({filename:r.x.filename,repo:r.x.source_repo,url:r.x.src,status:r.s})}}$('#status').textContent=`Checked ${Math.min(n+12,list.length)}/${list.length}: ${loaded} loaded, ${failed} failed/timeouts`}row('151 image records',list.length===151,`${list.length} records`);row('Original image URLs',failed===0,`${loaded} loaded; ${failed} failed/timeouts`);$('#raw').textContent=JSON.stringify({total:list.length,loaded,failed,failures:misses,checkedAt:new Date().toISOString(),note:'Browser network, privacy settings or a missing upstream source can cause failures.'},null,2);$('#status').textContent=`Image check complete: ${loaded}/${list.length} loaded; ${failed} failed/timeouts.`});</script></body></html>
