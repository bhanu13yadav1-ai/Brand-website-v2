<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="t d"><title id="t">Consent and comfort sequence</title><desc id="d">Four connected steps: ask, listen, check in, and stop or skip.</desc><rect width="680" height="410" rx="22" fill="#f8f4f7"/><path d="M98 126H580" stroke="#cdb6ca" stroke-width="8" stroke-linecap="round"/><path d="M98 126H580" stroke="#b77d9c" stroke-width="3" stroke-dasharray="7 11"/><g font-family="system-ui,sans-serif" text-anchor="middle"><circle cx="105" cy="126" r="43" fill="#342231"/><text x="105" y="135" font-size="24" font-weight="800" fill="#fff5fa">1</text><circle cx="262" cy="126" r="43" fill="#704b69"/><text x="262" y="135" font-size="24" font-weight="800" fill="#fff5fa">2</text><circle cx="419" cy="126" r="43" fill="#b77d9c"/><text x="419" y="135" font-size="24" font-weight="800" fill="#fff5fa">3</text><circle cx="576" cy="126" r="43" fill="#327249"/><text x="576" y="135" font-size="24" font-weight="800" fill="#fff5fa">4</text><text x="105" y="205" font-size="18" font-weight="800" fill="#342231">ASK</text><text x="262" y="205" font-size="18" font-weight="800" fill="#342231">LISTEN</text><text x="419" y="205" font-size="18" font-weight="800" fill="#342231">CHECK IN</text><text x="576" y="205" font-size="18" font-weight="800" fill="#342231">STOP / SKIP</text><text x="105" y="239" font-size="13" fill="#6e5b6c">Clear question</text><text x="262" y="239" font-size="13" fill="#6e5b6c">No pressure</text><text x="419" y="239" font-size="13" fill="#6e5b6c">Comfort now?</text><text x="576" y="239" font-size="13" fill="#6e5b6c">Always allowed</text></g><rect x="48" y="284" width="584" height="82" rx="15" fill="#342231"/><text x="340" y="316" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#fff5fa" text-anchor="middle">A YES CAN CHANGE.</text><text x="340" y="343" font-family="system-ui,sans-serif" font-size="14" fill="#f4c9dc" text-anchor="middle">No, pause and skip never need an explanation.</text></svg>
