<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Super Phase 3 local smoke harness</title><link rel="stylesheet" href="./super-phase3-experience.css"><style>body{margin:0;padding:14px;background:#100c10;color:#fff5fa;font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}nav button{min-height:44px;padding:8px 12px}.view{padding:10px}.view[hidden]{display:none}.page-intro{padding:15px;border:1px solid #4c3548;border-radius:14px}#view-boyfriend .wheel-section{margin:22px 0;padding:20px;border:1px solid #4c3548;border-radius:16px}.log{padding:12px;border:1px solid #4c3548;border-radius:12px;margin-bottom:16px}</style></head><body><div class="wrap"><h1>Phase 3 — Local interaction smoke test</h1><div class="log" id="status">Loading module and assets…</div><nav id="mainNav"><button data-view-link="home">Home</button><button data-view-link="innerwear">Innerwear</button><button data-view-link="sanskari">Collections</button><button data-view-link="wellness">Wellness</button><button data-view-link="boyfriend">Boyfriend & Couples</button><button data-view-link="stories">Stories</button><button data-view-link="fit">Fit Studio</button></nav><section class="view" id="view-home" data-view="home"><div class="page-intro"><h2>Home mock route</h2></div></section><section class="view" id="view-innerwear" data-view="innerwear" hidden><div class="page-intro"><h2>Innerwear mock route</h2></div></section><section class="view" id="view-sanskari" data-view="sanskari" hidden><div class="page-intro"><h2>Collections mock route</h2></div></section><section class="view" id="view-wellness" data-view="wellness" hidden><div class="page-intro"><h2>Wellness mock route</h2></div></section><section class="view" id="view-boyfriend" data-view="boyfriend" hidden><div class="page-intro"><h2>Boyfriend & Couples mock route</h2></div><section class="wheel-section"><button data-spin-wheel="wild">Existing Wild wheel action mock</button></section></section><section class="view" id="view-stories" data-view="stories" hidden><div class="page-intro"><h2>Stories mock route</h2></div></section><section class="view" id="view-fit" data-view="fit" hidden><div class="page-intro"><h2>Fit Studio mock route</h2></div></section></div><script>document.querySelectorAll('[data-view-link]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>{v.hidden=v.dataset.view!==b.dataset.viewLink;v.classList.toggle('active',!v.hidden);});}));</script><script src="./super-phase3-experience.js" defer></script><script>window.addEventListener('load',()=>{setTimeout(()=>{const x=window.BLACKED_SUPER_PHASE3;document.querySelector('#status').textContent=x?('Module '+x.version+' | initialized='+x.initialized+' | galleries='+x.galleriesInserted.length+' | errors='+x.errors.join('; ')):'module missing';},450);});</script></body></html>
